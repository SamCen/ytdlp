[project]
name = "ytdlp-desktop"
version = "0.1.0"
description = "Desktop downloader built on yt-dlp"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "yt-dlp[default,curl-cffi]",
]

[project.scripts]
ytdlp-desktop = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
